spring.application.name=medical-printer
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medicalprinter}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiracion-minutos=60
app.iva=0.19
app.cors.origenes=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
